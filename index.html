<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設備点検管理デモ</title><link rel="stylesheet" href="style.css"></head><body><header><div><strong>設備点検管理</strong><small>再構築デモ・架空データ</small></div><nav><button data-tab="dashboard" class="active">ダッシュボード</button><button data-tab="inspect">点検入力</button><button data-tab="history">点検履歴</button></nav></header><main><section id="dashboard" class="view"><h1>ダッシュボード</h1><p class="sub">点検状況を一覧で確認できます。</p><div id="stats" class="stats"></div><div class="panel"><h2>設備別の点検状況</h2><div id="equipmentStatus"></div></div><div class="panel"><h2>最近の点検記録</h2><div id="recent"></div></div></section><section id="inspect" class="view hidden"><h1>点検結果の入力</h1><p class="sub">項目横の「？」を押すと初心者向けの確認ポイントを表示します。</p><form id="inspectionForm"><div class="panel fields"><label>物件名<input id="property" value="サンプルマンションA" required maxlength="80"></label><label>点検箇所<select id="equipment"></select></label><label>点検日<input id="date" type="date" required></label><label>担当者<input id="inspector" placeholder="例：山田" required maxlength="50"></label></div><div id="checklist" class="panel"></div><div class="panel"><label>備考<textarea id="notes" rows="3" placeholder="特記事項があれば記入"></textarea></label><button class="primary" type="submit">点検結果を登録する</button></div></form></section><section id="history" class="view hidden"><h1>点検履歴</h1><p class="sub">記録を選んでPDF保存用の報告書を表示できます。</p><div id="historyList" class="panel"></div></section></main><dialog id="helpDialog"><h2 id="helpTitle"></h2><p id="helpBody"></p><button id="closeHelp">閉じる</button></dialog><div id="toast" role="status" aria-live="polite"></div><footer>※業務検証用デモです。記録はこのブラウザ内に保存され、サーバーへ送信されません。実運用には認証・バックアップ等の追加開発が必要です。</footer><script src="app.js"></script></body></html>
